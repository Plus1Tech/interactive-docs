<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise Client Technical Documentation</title><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#0b0f5c;color:#fff}.load{min-height:100vh;display:grid;place-items:center}.card{max-width:720px;margin:32px;padding:32px;border-radius:18px;background:#151a8d;box-shadow:0 18px 50px rgba(0,0,0,.28)}h1{margin:0 0 12px;font-size:30px}p{line-height:1.6;color:#e5e8ff}.error{color:#ffd4d4;white-space:pre-wrap}</style></head><body><div class="load"><main class="card"><h1>Enterprise Client Technical Documentation</h1><p id="status">Loading the interactive documentation…</p></main></div><script>(async()=>{try{const r=await fetch('./assets/enterprise-web-00.txt',{cache:'no-store'});if(!r.ok)throw new Error('Payload request failed: '+r.status);const b64=(await r.text()).trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('This browser does not support gzip decompression. Use a current version of Edge or Chrome.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!/<html[\s>]/i.test(html))throw new Error('The published document payload is invalid.');document.open();document.write(html);document.close();}catch(e){const s=document.getElementById('status');s.className='error';s.textContent='The documentation could not be loaded.\n\n'+e.message;console.error(e);}})();</script></body></html>
